  <text x="281" y="132" font-family="system-ui" font-size="14" font-weight="500" text-anchor="middle" fill="#808080">Discovered</text>
  <rect x="47" y="145" width="94" height="3" rx="1.5" fill="#4DD0E1"/>
  <rect y="147" width="375" height="1" fill="#3D3D3D"/>
  
  <!-- Badge on Discovered tab -->
  <circle cx="340" cy="125" r="10" fill="#B388FF"/>
  <text x="340" y="129" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle" fill="#121212">8</text>
  
  <!-- Device Card 1 -->
  <rect x="12" y="160" width="351" height="130" rx="16" fill="#1E1E1E"/>
  
  <!-- Device Icon Background -->
  <defs>
    <linearGradient id="iconGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4DD0E1"/>
      <stop offset="100%" style="stop-color:#B388FF"/>
    </linearGradient>
  </defs>
  <rect x="28" y="176" width="64" height="64" rx="16" fill="url(#iconGradientDark)"/>
  <!-- Router Icon -->
  <circle cx="60" cy="208" r="12" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="60" cy="208" r="6" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="60" cy="208" r="2" fill="white"/>
  
  <!-- Status Indicator -->
  <circle cx="84" cy="232" r="6" fill="#66BB6A" stroke="#1E1E1E" stroke-width="2"/>
  
  <!-- Device Info -->
  <text x="108" y="196" font-family="system-ui" font-size="16" font-weight="600" fill="#FFFFFF">Living Room Router</text>
  <text x="108" y="216" font-family="system-ui" font-size="14" fill="#B0B0B0">192.168.1.1 • ASUS</text>
  
  <!-- Chips -->
  <rect x="108" y="230" width="62" height="24" rx="12" fill="#1B5E20"/>
  <text x="139" y="247" font-family="system-ui" font-size="11" font-weight="500" text-anchor="middle" fill="#A5D6A7">● Online</text>
  
  <rect x="176" y="230" width="52" height="24" rx="12" fill="#E65100"/>
  <text x="202" y="247" font-family="system-ui" font-size="11" font-weight="500" text-anchor="middle" fill="#FFCC80">v3.0.1</text>
  
  <rect x="234" y="230" width="52" height="24" rx="12" fill="#0D47A1"/>
  <text x="260" y="247" font-family="system-ui" font-size="11" font-weight="500" text-anchor="middle" fill="#90CAF9">Saved</text>
  
  <!-- Menu Button -->
  <circle cx="335" cy="185" r="3" fill="#808080"/>
  <circle cx="335" cy="193" r="3" fill="#808080"/>
  <circle cx="335" cy="201" r="3" fill="#808080"/>
  
  <!-- Device Card 2 -->
