      <stop offset="0%" style="stop-color:#00BCD4"/>
      <stop offset="100%" style="stop-color:#7C4DFF"/>
    </linearGradient>
  </defs>
  <rect x="28" y="176" width="64" height="64" rx="16" fill="url(#iconGradient)"/>
  <!-- Router Icon -->
  <circle cx="60" cy="208" r="12" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="60" cy="208" r="6" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="60" cy="208" r="2" fill="white"/>
  
  <!-- Status Indicator -->
  <circle cx="84" cy="232" r="6" fill="#4CAF50" stroke="white" stroke-width="2"/>
  
  <!-- Device Info -->
  <text x="108" y="196" font-family="system-ui" font-size="16" font-weight="600" fill="#212121">Living Room Router</text>
  <text x="108" y="216" font-family="system-ui" font-size="14" fill="#757575">192.168.1.1 • ASUS</text>
  
  <!-- Chips -->
  <rect x="108" y="230" width="62" height="24" rx="12" fill="#E8F5E9"/>
  <text x="139" y="247" font-family="system-ui" font-size="11" font-weight="500" text-anchor="middle" fill="#2E7D32">● Online</text>
  
  <rect x="176" y="230" width="52" height="24" rx="12" fill="#FFF3E0"/>
  <text x="202" y="247" font-family="system-ui" font-size="11" font-weight="500" text-anchor="middle" fill="#E65100">v3.0.1</text>
  
