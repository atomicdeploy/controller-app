  <text x="108" y="358" font-family="system-ui" font-size="14" fill="#757575">192.168.1.105 • Apple</text>
  
  <!-- Chips -->
  <rect x="108" y="372" width="62" height="24" rx="12" fill="#E8F5E9"/>
  <text x="139" y="389" font-family="system-ui" font-size="11" font-weight="500" text-anchor="middle" fill="#2E7D32">● Online</text>
  
  <rect x="176" y="372" width="52" height="24" rx="12" fill="#E3F2FD"/>
  <text x="202" y="389" font-family="system-ui" font-size="11" font-weight="500" text-anchor="middle" fill="#1565C0">Saved</text>
  
  <!-- Menu Button -->
  <circle cx="335" cy="327" r="3" fill="#9E9E9E"/>
  <circle cx="335" cy="335" r="3" fill="#9E9E9E"/>
  <circle cx="335" cy="343" r="3" fill="#9E9E9E"/>
  
  <!-- Device Card 3 -->
  <rect x="12" y="444" width="351" height="130" rx="16" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Smart TV Icon Background -->
  <rect x="28" y="460" width="64" height="64" rx="16" fill="url(#iconGradient)"/>
  <!-- TV Icon -->
  <rect x="42" y="478" width="36" height="24" rx="2" fill="none" stroke="white" stroke-width="2"/>
  <line x1="52" y1="504" x2="68" y2="504" stroke="white" stroke-width="2"/>
  
  <!-- Status Indicator - Offline -->
  <circle cx="84" cy="516" r="6" fill="#F44336" stroke="white" stroke-width="2"/>
  
  <!-- Device Info -->
  <text x="108" y="480" font-family="system-ui" font-size="16" font-weight="600" fill="#212121">Samsung Smart TV</text>
  <text x="108" y="500" font-family="system-ui" font-size="14" fill="#757575">192.168.1.42 • Samsung</text>
  
  <!-- Chips -->
  <rect x="108" y="514" width="62" height="24" rx="12" fill="#FFEBEE"/>
  <text x="139" y="531" font-family="system-ui" font-size="11" font-weight="500" text-anchor="middle" fill="#C62828">● Offline</text>
  
  <rect x="176" y="514" width="52" height="24" rx="12" fill="#E3F2FD"/>
  <text x="202" y="531" font-family="system-ui" font-size="11" font-weight="500" text-anchor="middle" fill="#1565C0">Saved</text>
  
  <!-- Menu Button -->
  <circle cx="335" cy="469" r="3" fill="#9E9E9E"/>
  <circle cx="335" cy="477" r="3" fill="#9E9E9E"/>
  <circle cx="335" cy="485" r="3" fill="#9E9E9E"/>
  
  <!-- FAB -->
  <circle cx="335" cy="738" r="28" fill="#7C4DFF"/>
  <!-- Refresh Icon -->
  <path d="M335,724 L335,718 L329,724 L335,730 L335,724" fill="white" transform="rotate(45,335,738)"/>
  <circle cx="335" cy="738" r="10" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Home Indicator -->
  <rect x="137" y="796" width="101" height="5" rx="2.5" fill="#212121"/>
