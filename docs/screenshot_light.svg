<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <!-- Background -->
  <rect width="375" height="812" fill="#FAFAFA"/>
  
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#FAFAFA"/>
  <text x="187" y="30" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle" fill="#212121">9:41</text>
  
  <!-- Toolbar -->
  <rect y="44" width="375" height="56" fill="#FAFAFA"/>
  <text x="16" y="80" font-family="system-ui" font-size="20" font-weight="600" fill="#212121">Controller</text>
  <circle cx="319" cy="72" r="16" fill="none" stroke="#757575" stroke-width="2"/>
  <circle cx="355" cy="72" r="3" fill="#757575"/>
  <circle cx="355" cy="80" r="3" fill="#757575"/>
  
  <!-- Tabs -->
